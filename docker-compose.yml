version: '3.8'

services:
  backend:
    build:
      context: .
      target: production
    container_name: educenter-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'